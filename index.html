<!DOCTYPE html>
<html lang="en" data-theme="tokyo-sunset">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player</title>
    <link rel="preload" href="public/img/image-asset.jpeg" as="image" fetchpriority="high">
    <link rel="preload" href="public/img/bg2.jpg" as="image" fetchpriority="high">
    <script type="module" src="https://cdn.jsdelivr.net/npm/dreamdesk-ui@0.1.9/js/dreamdesk.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dreamdesk-ui@0.1.9/css/globals.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dreamdesk-ui@0.1.9/css/base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dreamdesk-ui@0.1.9/css/pastelcore.css" />
    <link rel="stylesheet" href="styles.css" />
    <link id="skin-stylesheet" rel="stylesheet" href="">
    <script src="features.js"></script>
    <script src="player.js" defer></script>
    <script type="module" src="visualizer-boot.js"></script>
    <script src="skin-switcher.js"></script>
</head>

<body>
    <div class="container"><dreamdesk-window id="player-window" title="player" width="297px" height="145px"
            resizable="false" minimize-animation="customMinimize" fullscreen-animation="customFullscreen"
            fullscreen-mode="expand">
            <div class="player">
                <div class="display">
                    <div class="audiowave" id="audiowave">
                        <div class="timer" id="countdown-timer">3:05</div>
                        <div id="histogram-container">
                            <canvas id="histogram" width="100" height="35"></canvas>
                        </div>
                    </div>
                    <div class="current-track" id="current-track">
                        <p class="neon" data-text=""></p>
                    </div>
                    <div class="player-controls">
                        <button id="prev-button" data-action="prev">⏮︎</button>
                        <button id="pause-button" data-action="pause">⏸︎</button>
                        <button id="play-button" data-action="play">▶︎</button>
                        <button id="stop-button" data-action="stop">⏹︎</button>
                        <button id="next-button" data-action="next">⏭︎</button>
                        <button id="upload-button" title="upload">⏏︎</button>
                        <button id="shuffle-toggle" class="toggle-btn" aria-pressed="false"
                            title="Shuffle">Shuffle</button>
                        <button id="repeat-toggle" class="toggle-btn" aria-pressed="false"
                            title="Repeat">Repeat</button>

                    </div>
                    <input id="upload-input" type="file" accept="audio/*" style="display:none" />
                    <div class="screen" id="kbps"><span class="value"></span><span class="unit">kbps</span>
                    </div>
                    <div class="screen" id="khz"><span class="value"></span><span class="unit">kHz</span>
                    </div>
                    <div class="volume-controls-top">
                        <input type="range" min="0" max="100" value="50" class="volume-slider" id="volume-slider">
                        <input type="range" min="-100" max="100" value="0" step="1" class="balance-slider"
                            id="balance-slider" title="Balance: Left (-) / Right (+)" aria-label="Balance">
                        <button type="button" id="eq-button" class="mini-btn" title="Equalizer"
                            aria-label="Equalizer">EQ</button>
                        <button type="button" id="pl-button" class="mini-btn" title="Playlist"
                            aria-label="Playlist">PL</button>
                        <button type="button" id="viz-button" class="mini-btn" title="Visualizer"
                            aria-label="Visualizer">VIZ</button>
                    </div>
                    <div class="seek-controls">
                        <input type="range" min="0" max="100" value="0" step="1" class="seek-slider" id="seek-slider">
                    </div>
                </div>
            </div>
        </dreamdesk-window>
        <div id="webgl-viz" style="display:none;">
            <div class="viz-header">visualizer</div>
            <canvas id="glcanvas" width="420" height="320"></canvas>
        </div>
        <div id="playlist-dock" style="display:none;">
            <div class="playlist-header">playlist</div>
            <div class="track-list scrollable" id="track-list">
                <ol class="track-items" id="track-items"></ol>
            </div>
        </div>
        <div id="eq-dock" style="display:none;">
            <div class="eq-panel">
                <div class="eq-header"><span>equalizer</span></div>
                <div class="eq-presets">
                    <div class="eq-side">
                        <button id="eq-presets-btn" class="mini-btn" title="Presets" aria-haspopup="menu"
                            aria-expanded="false">presets ▾</button>
                        <div id="eq-presets-menu" class="presets-menu" role="menu" aria-hidden="true"></div>
                    </div>
                    <div class="eq-sliders">
                        <label><span>60</span><input class="eq-slider" type="range" min="-12" max="12" value="0"
                                data-band="0"></label>
                        <label><span>170</span><input class="eq-slider" type="range" min="-12" max="12" value="0"
                                data-band="1"></label>
                        <label><span>350</span><input class="eq-slider" type="range" min="-12" max="12" value="0"
                                data-band="2"></label>
                        <label><span>1k</span><input class="eq-slider" type="range" min="-12" max="12" value="0"
                                data-band="3"></label>
                        <label><span>3k</span><input class="eq-slider" type="range" min="-12" max="12" value="0"
                                data-band="4"></label>
                        <label><span>10k</span><input class="eq-slider" type="range" min="-12" max="12" value="0"
                                data-band="5"></label>
                        <label><span>16k</span><input class="eq-slider" type="range" min="-12" max="12" value="0"
                                data-band="6"></label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
